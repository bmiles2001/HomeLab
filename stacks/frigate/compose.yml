name: frigate

# NVR for the house cameras.
#
# Deploy:  ./scripts/deploy.sh frigate
#
# Required secrets are validated by deploy.sh, not by ${VAR:?} guards in this
# file, so plain `docker compose down/logs/ps` works in this directory.
#
# Three rules specific to this stack:
#
#   1. It is LAN-only, permanently. Do not put it behind a public hostname.
#      See docs/decisions.md#frigate-is-lan-only-and-that-is-not-a-for-now.
#   2. Frigate's own config lives in ./config.yml, in git. The web UI can edit
#      that file, which would make the running config diverge from this repo.
#      Use the UI to *read*; make changes here and redeploy. Same rule as
#      Portainer's editor - see docs/decisions.md.
#   3. It will not start without a detector model on disk. There is no default
#      ONNX model in the image. Generate it once before the first deploy -
#      docs/frigate.md#step-1-build-the-detector-model.

services:
  frigate:
    container_name: frigate

    # The -tensorrt variant, NOT the default image. The name is a leftover:
    # inside it you configure `type: onnx`, not `type: tensorrt`. The image
    # carries the CUDA execution provider for ONNX Runtime, which is what
    # makes the 3080 usable as a detector. Guides written before 0.17 will
    # tell you to use `type: tensorrt` - that path is gone for desktop NVIDIA
    # cards and only survives on Jetson.
    image: ghcr.io/blakeblackshear/frigate:${FRIGATE_VERSION:-0.17.2}-tensorrt
    restart: unless-stopped

    # Frigate passes decoded frames between processes through /dev/shm. The
    # 64MB Docker default causes "Bus error" crashes once you have more than a
    # couple of cameras. Frigate's docs give a per-camera formula; 512MB is a
    # safe starting point for a handful of cameras and costs nothing until used.
    shm_size: "512mb"

    volumes:
      - /etc/localtime:/etc/localtime:ro

      # frigate.db - the event and tracked-object history. An earlier version
      # of this stack mounted nothing here, which quietly threw away every
      # event on each deploy.
      - frigate_config:/config

      # The detector model, on a real path rather than inside the volume above.
      # It has to be put in place by hand *before* the first deploy, because
      # Frigate will not start without it - and dropping a file into a named
      # volume means either `docker cp` into a container that refuses to run,
      # or going digging in /var/lib/docker. A bind mount makes it a copy.
      # See docs/frigate.md#step-1-build-the-detector-model.
      - ${FRIGATE_MODELS:-/srv/frigate/models}:/config/model_cache

      # Mounted *over* the volume above, read-only, so the UI's config editor
      # physically cannot save over it. Docker applies mounts by path depth,
      # so the file wins over the directory regardless of order here.
      - ./config.yml:/config/config.yml:ro

      - ${FRIGATE_MEDIA:-/srv/frigate/media}:/media/frigate
      # Frigate writes segments here before deciding whether to keep them.
      # tmpfs keeps that churn off the NVMe entirely. Still used with
      # recording disabled - previews and snapshot extraction land here.
      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: 1000000000

    environment:
      TZ: ${TZ:-America/Chicago}

      # Any variable named FRIGATE_* can be referenced as {FRIGATE_*} inside
      # config.yml. That is how camera and broker credentials stay out of git.
      # All three are injected by scripts/deploy.sh from Infisical.
      FRIGATE_RTSP_USER: ${FRIGATE_RTSP_USER}
      FRIGATE_RTSP_PASSWORD: ${FRIGATE_RTSP_PASSWORD}
      FRIGATE_MQTT_USER: ${FRIGATE_MQTT_USER}
      FRIGATE_MQTT_PASSWORD: ${FRIGATE_MQTT_PASSWORD}

      # `capabilities: [gpu]` below resolves to compute+utility only. NVDEC -
      # the hardware video decoder ffmpeg uses for the camera streams - lives
      # behind the `video` capability, and without this line detection works
      # on the GPU while decoding silently falls back to the CPU. That failure
      # is invisible in the UI and shows up only as a busy i9.
      NVIDIA_DRIVER_CAPABILITIES: all
      NVIDIA_VISIBLE_DEVICES: all

    # The RTX 3080. Same mechanism Immich's ML container uses, and the reason
    # docs/decisions.md#the-two-gpus-get-one-workload-each needed amending:
    # both workloads are now on this card. Watch for contention during a large
    # Immich import - see docs/frigate.md#sharing-the-3080-with-immich.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    networks:
      - proxy    # reached by caddy at frigate:8971
      - iot      # reaches mosquitto; no route off the box

    # No published ports. Frigate's docs show 5000/8971/8554 published to the
    # host; that is for people without a reverse proxy. 8971 is the
    # authenticated UI and Caddy reaches it over `proxy`. Port 5000 is the
    # UNAUTHENTICATED admin port - never publish it.
    #
    # The exception is go2rtc's RTSP restream on 8554, if you later want other
    # apps pulling streams. Bind it to the LAN deliberately when that day comes:
    #   ports:
    #     - "10.0.0.4:8554:8554"

volumes:
  frigate_config:

networks:
  proxy:
    external: true
  iot:
    external: true
