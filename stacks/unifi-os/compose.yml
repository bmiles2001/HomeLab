name: unifi-os

# UniFi OS Server, in Docker. The controller for the house switch and APs.
#
# Deploy:  ./scripts/deploy.sh unifi-os
#
# Replaces stacks/unifi/ (the legacy Network Application), which is parked.
# It also replaces the plan to install UniFi OS Server on the host - see
# docs/decisions.md#unifi-os-server-in-a-container-not-on-the-host.
#
# THREE THINGS TO UNDERSTAND BEFORE TOUCHING THIS FILE
#
# 1. This is a THIRD-PARTY REPACKAGING of a proprietary Ubiquiti binary.
#    Ubiquiti ship UniFi OS Server as a host installer and say plainly that it
#    will not be offered as a container. github.com/lemker/unifi-os-server
#    extracts their binary into an image anyway. It works, but there is no
#    vendor support, and an upstream change can break it with no warning and
#    no fix until one maintainer gets to it. Pin the tag; read the release
#    notes; keep stacks/unifi/ parked as the way back.
#
# 2. It runs systemd, and therefore wants the host's cgroup hierarchy
#    read-write plus NET_ADMIN and NET_RAW. That is a much larger privilege
#    grant than anything else in this repo, and it is the real price of this
#    approach. See docs/unifi-os.md#what-this-container-can-do-to-the-host.
#
# 3. It is on the LAN directly, via macvlan, at a fixed address. That is what
#    makes discovery and one-click adoption work, and it is why this stack
#    publishes NO PORTS AT ALL - it does not need to borrow the host's. It is
#    the only container here that is not behind NAT.

services:
  unifi-os-server:
    container_name: unifi-os-server
    # Pinned rather than `latest`. This image is rebuilt whenever the
    # maintainer re-extracts a new UniFi release, so `latest` means "whatever
    # a stranger published this morning" - which is not a thing to point the
    # house network at. Check the tag list before bumping:
    #   https://github.com/lemker/unifi-os-server/pkgs/container/unifi-os-server
    image: ghcr.io/lemker/unifi-os-server:${UNIFI_OS_VERSION:-latest}
    restart: unless-stopped

    # UniFi OS Server is not one process. It is systemd running a tree of
    # services - the Network application, MongoDB, RabbitMQ - inside one
    # container, which is why this needs the host's cgroup hierarchy rather
    # than the private namespace Docker would normally give it.
    #
    # This is the single most privileged setting in this repo. Write access to
    # the host cgroup hierarchy is a well-known escape primitive. It is
    # accepted here only because this stack is LAN-only and the alternative
    # was installing the same software directly on the host, where it would
    # have had everything anyway.
    cgroup: host
    cap_add:
      - NET_RAW      # STUN and discovery need raw sockets
      - NET_ADMIN    # systemd-networkd inside the container

    extra_hosts:
      host.docker.internal: host-gateway

    # systemd needs these writable and non-persistent. `exec` on /run and /tmp
    # is required - the default `noexec` makes unit startup fail in ways that
    # look like the application is broken rather than the mount.
    tmpfs:
      - /run:exec
      - /run/lock
      - /tmp:exec
      - /var/lib/journal
      - /var/opt/unifi/tmp:size=64m

    environment:
      # The address devices are told to report to. Written into each device's
      # inform URL at adoption, so getting it wrong gives devices that adopt
      # and then vanish - the same failure the legacy stack had, except this
      # time it is declared here instead of clicked into a settings page.
      #
      # The container's OWN macvlan address, not forge's. Devices reach it
      # directly on the LAN - no NAT, no published port, no host involved.
      # An IP rather than the Caddy hostname on purpose: an access point
      # depending on DNS is one more thing that can fail at 11pm.
      #
      # Must match `ipv4_address` below. If they ever disagree, devices adopt
      # against one address and are told to report to another, which presents
      # as adoption succeeding and the device dropping off minutes later.
      UOS_SYSTEM_IP: ${UNIFI_OS_IP:-10.0.0.20}

    volumes:
      # Required for systemd. Read-write, and yes, that is as broad as it reads.
      - /sys/fs/cgroup:/sys/fs/cgroup:rw

      # All state, on real paths rather than named volumes. This is the only
      # copy of every adoption key and all site history, and something outside
      # the container has to be able to back it up - which nothing does yet.
      # See docs/decisions.md#still-open.
      - ${UNIFI_OS_ROOT:-/srv/unifi-os}/persistent:/persistent
      - ${UNIFI_OS_ROOT:-/srv/unifi-os}/var-log:/var/log
      - ${UNIFI_OS_ROOT:-/srv/unifi-os}/data:/data
      - ${UNIFI_OS_ROOT:-/srv/unifi-os}/srv:/srv
      - ${UNIFI_OS_ROOT:-/srv/unifi-os}/var-lib-unifi:/var/lib/unifi
      - ${UNIFI_OS_ROOT:-/srv/unifi-os}/var-lib-mongodb:/var/lib/mongodb
      - ${UNIFI_OS_ROOT:-/srv/unifi-os}/etc-rabbitmq-ssl:/etc/rabbitmq/ssl

    # NO `ports:` SECTION, AND THAT IS THE POINT.
    #
    # An earlier draft published 8080, 3478/udp, 10003/udp and 11443 on the
    # host and needed a documented exception to README rule 2. On macvlan the
    # container owns 10.0.0.20 outright: devices reach 8080 and 3478 there
    # directly, discovery broadcasts arrive because it is genuinely on the
    # same segment, and the console is on 443 of its own address. Nothing is
    # borrowed from the host, so there is nothing to except.
    #
    # This means every port the image opens is reachable from the LAN, which
    # is the honest trade for being a real host on it - the same as any
    # appliance you might have bought instead.

    networks:
      # The house LAN. Fixed address because UOS_SYSTEM_IP above names it and
      # every adopted device will store it. Must sit inside `lan`'s
      # --ip-range (10.0.0.16/28) and be excluded from the Orbi's DHCP pool.
      lan:
        ipv4_address: ${UNIFI_OS_IP:-10.0.0.20}
        # Higher priority makes this the default route rather than `proxy`,
        # so the controller's outbound traffic leaves via the house gateway
        # with a LAN source address. Devices and Ubiquiti's cloud both see a
        # consistent address that way.
        priority: 100
      # Still on `proxy`, so Caddy reaches the console by container name.
      # Necessary, not redundant: the HOST cannot talk to a macvlan address
      # by design, and Caddy is a container on this bridge rather than a
      # process on forge. See docs/unifi-os.md#the-host-cannot-reach-it.
      proxy:
        priority: 10

    # No healthcheck. The image ships none, and a naive check against 443
    # would report healthy while the Network application inside is still
    # starting - worse than no signal. `docker logs unifi-os-server` and the
    # console itself are the honest checks.

networks:
  # Both created out of band by bootstrap.sh and declared external, so no
  # stack owns them and tearing this one down cannot delete them.
  lan:
    external: true
  proxy:
    external: true
