name: immich

# IMPORTANT: Immich's compose file changes between releases. Before a major
# upgrade, diff this against the official one for the version you're pinning:
#   https://github.com/immich-app/immich/releases/latest/download/docker-compose.yml
#
# Deploy:  ./scripts/deploy.sh immich
#
# Required secrets are validated by deploy.sh, not by ${VAR:?} guards in this
# file, so plain `docker compose down/logs/ps` works in this directory.
#
# Two deliberate differences from upstream:
#   1. No published ports. Caddy reaches immich-server over the `proxy`
#      network by name, so nothing here listens on the LAN.
#   2. env_file replaced with explicit `environment:` blocks, because secrets
#      arrive as injected environment variables rather than a file on disk.

services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    restart: unless-stopped
    volumes:
      # A real path on the NVMe. Bind mount rather than a named volume
      # because scripts/immich-onedrive-sync.sh reads it directly.
      - ${UPLOAD_LOCATION:-/srv/immich/data}:/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      DB_HOSTNAME: ${DB_HOSTNAME:-database}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE_NAME: ${DB_DATABASE_NAME:-immich}
      REDIS_HOSTNAME: ${REDIS_HOSTNAME:-redis}
      TZ: ${TZ:-America/Chicago}
      # Defaults to true so a fresh install can create its first admin. Flip it
      # to false in Infisical right after you register - see docs/immich-deploy.md.
      # This is a hard prerequisite for forwarding 443: Immich hands admin to
      # whoever loads the site first, and "first" stops meaning "you" the
      # moment the port is open.
      IMMICH_ALLOW_SETUP: ${IMMICH_ALLOW_SETUP:-true}

      # Immich is Express underneath, and Express's `trust proxy` is off by
      # default. Without this, req.ip is whatever socket connected - which is
      # always Caddy, on the proxy network, identical for every request on
      # earth. The login rate limiter buckets by that address, so one attacker
      # would either lock out the whole family or, at a limit high enough to
      # avoid that, face no meaningful limit at all. Audit logs and sessions
      # would show 172.x for everyone, too.
      #
      # A CIDR rather than an address, because container IPs change on restart.
      # This is the `proxy` network's subnet, confirmed on forge and now pinned
      # in bootstrap.sh so a rebuild can't quietly hand it a different range:
      #   docker network inspect proxy -f '{{range .IPAM.Config}}{{.Subnet}}{{end}}'
      #
      # If those two ever disagree, this silently stops working - nothing
      # errors, the rate limiter just goes back to seeing one address for the
      # whole internet. bootstrap.sh warns about the mismatch for that reason.
      #
      # Verify rather than assume: fail a login from a phone on cellular and
      # check the logged address is the carrier's, not 172.x. This setting has
      # silently no-opped in some releases (immich-app/immich#14886).
      IMMICH_TRUSTED_PROXIES: ${IMMICH_TRUSTED_PROXIES:-172.18.0.0/16}
    depends_on:
      - redis
      - database
    networks:
      - default   # reaches postgres and redis
      - proxy     # reachable by caddy
    healthcheck:
      disable: false

  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}-cuda
    restart: unless-stopped
    volumes:
      - model-cache:/cache
    environment:
      TZ: ${TZ:-America/Chicago}
    networks:
      - default
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      disable: false

  redis:
    container_name: immich_redis
    # Upstream pins `valkey:9`. There is no `9-bookworm` tag - an earlier draft
    # of this file invented one by analogy with the redis images, and the pull
    # fails with "not found". Match upstream and leave it alone.
    image: docker.io/valkey/valkey:9
    restart: unless-stopped
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  database:
    container_name: immich_postgres
    # Immich's own Postgres build with the VectorChord extension baked in.
    # Do not substitute a stock postgres image - it will not start.
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE_NAME:-immich}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      # A named volume rather than a bind mount, on purpose: it lives on the
      # machine's ext4 disk with correct ownership, and it is impossible to
      # accidentally point at C:/ later. Recovery is via pg_dump, not by
      # copying this directory.
      - pgdata:/var/lib/postgresql/data
    shm_size: 128mb
    networks:
      - default
    healthcheck:
      disable: false

volumes:
  model-cache:
  pgdata:

networks:
  default:
  proxy:
    external: true
