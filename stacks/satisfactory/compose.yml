name: satisfactory

# Satisfactory dedicated server.
#
# Deploy:  ./scripts/deploy.sh satisfactory
#
# Upstream: https://github.com/wolveix/satisfactory-server
# Runbook:  docs/satisfactory.md
#
# Required secrets are validated by deploy.sh, not by ${VAR:?} guards in this
# file, so plain `docker compose down/logs/ps` works in this directory. This
# stack has no secrets at all - its case in required_vars() is deliberately
# empty rather than absent. Server access is controlled by the in-game claim
# and admin password, which live in the game's own config, not here.
#
# FOUR THINGS ARE UNUSUAL ABOUT THIS STACK, and all four are deliberate:
#
#   1. IT PUBLISHES PORTS, and Caddy is not involved. Satisfactory speaks raw
#      UDP on 7777; a reverse proxy cannot carry that. This is the second and
#      only other exception to "caddy is the only stack that publishes ports",
#      and bootstrap.sh check 6 has an allow-list entry to match. See
#      docs/decisions.md#satisfactory-publishes-ports-and-caddy-cannot-help.
#   2. IT IS REACHABLE FROM THE INTERNET on those ports, with no auth in front
#      of them. Not "LAN-only for now" - the whole point is friends joining.
#      What that does and does not expose is in docs/satisfactory.md#exposure.
#   3. THE GAME CONTAINER IS NOT ON THE `proxy` NETWORK. Nothing about the
#      game is HTTP, so there is nothing for Caddy to route. It gets the
#      stack's own default bridge. The `saves` sidecar further down IS on
#      `proxy` - it is an ordinary static file server and is routed like
#      everything else in the house.
#   4. IT DOWNLOADS ~20GB ON FIRST START and takes a while to come up. That is
#      SteamCMD fetching the game, not a hang. See the runbook.
#
# A FIFTH THING was added later, and it is two ordinary services rather than a
# fifth oddity. `saves-updater` keeps latest/latest.sav pointed at the newest
# save; `saves` serves that one directory over plain HTTP so the
# Satisfactory-Calculator Interactive Map can load it from spaghetti.<domain>.
# Neither publishes a port, both are LAN-only like every other hostname in the
# Caddyfile, and the game container is untouched by either.
#
# Why the map does not need a public address to read it, and why the updater
# lives here rather than as a systemd timer on the host, are both in
# docs/satisfactory.md#viewing-the-save-on-the-interactive-map.
#
# The single most important setting is NOT in this file: turn on Auto Pause in
# the in-game Server Manager after claiming the server. Without it an empty
# server simulates the whole factory forever and burns a core for nobody.

services:
  satisfactory:
    container_name: satisfactory
    hostname: satisfactory

    # Pinned rather than :latest, same as every other stack here. Upstream
    # ships new tags on game updates; bump this deliberately and read the
    # release notes first, because a server version ahead of everyone's client
    # locks the whole group out until Steam pushes the client update.
    #
    # Note this pins the CONTAINER, not the game. The game updates itself on
    # every container start regardless (see SKIPUPDATE below), so pinning here
    # buys reproducible plumbing, not a frozen game version.
    image: docker.io/wolveix/satisfactory-server:${SATISFACTORY_VERSION:-latest}
    restart: unless-stopped

    environment:
      TZ: ${TZ:-America/Chicago}

      # The server drops to this user before running the game, and every file
      # under /config is written as it. Mismatch with the owner of
      # /srv/satisfactory is the cause of essentially every "permission denied"
      # in upstream's issue tracker. bootstrap.sh creates the directory owned
      # by 1000:1000 to match.
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}

      MAXPLAYERS: ${SATISFACTORY_MAXPLAYERS:-4}

      # Stable branch. `true` puts the server on Experimental, which requires
      # every client to also be on Experimental - a group-wide decision, not a
      # server-side toggle. Leave it alone unless everyone has agreed.
      STEAMBETA: "false"

      # Defaults, written out because they are the knobs worth knowing exist:
      #
      # AUTOSAVENUM=5           rotating autosaves kept
      MAXTICKRATE: 60            # sim tick rate ceiling
      # MAXOBJECTS=2162688      object limit; raise only if the log complains
      # SERVERSTREAMING=true    asset streaming; leave on
      # TIMEOUT=30              client timeout in seconds
      # DISABLESEASONALEVENTS   set true only if you dislike FICSMAS
      #
      # SKIPUPDATE=false is the default and stays that way: the game updates
      # itself on every container start, which is what you want on a box that
      # reboots for kernel patches. The cost is a slower start after an update.
      #
      # VMOVERRIDE skips the CPU model check. forge is a bare-metal i9-12900KS,
      # so it is not needed and must stay off - if that check ever fires, the
      # answer is to read why, not to silence it.

      # Only if the ports below are ever changed. The game needs to know its
      # own ports, so a host-side remap alone would produce a server that
      # listens on one port and advertises another.
      # SERVERGAMEPORT: 7777
      # SERVERMESSAGINGPORT: 8888

    volumes:
      - /etc/localtime:/etc/localtime:ro

      # One bind mount holding four things, and only two of them matter:
      #
      #   saved/     THE SAVES, blueprints and server config. This is the only
      #              irreplaceable directory on this stack.
      #   backups/   automatic copies of saved/, made when the container starts
      #   gamefiles/ ~20GB of game install. Outside the container on purpose so
      #              a rebuild does not redownload it.
      #   logs/      steam's logs, emptied on start unless LOG=true
      #
      # Bind mount rather than a named volume so it lands on /srv with
      # everything else worth backing up, and so saves can be copied off with
      # plain cp. See docs/storage-expansion.md#layout.
      #
      # backups/ is on the SAME DISK as saved/, so it is protection against a
      # corrupt save, not against losing the drive. Nothing here is off-box
      # today - see docs/satisfactory.md#backups.
      - ${SATISFACTORY_DATA:-/srv/satisfactory}:/config

    ports:
      # All three are required, and the FAQ's most common report is someone
      # forwarding one of them:
      #
      #   7777/udp  the game itself. This is the one a reverse proxy cannot
      #             carry, and the reason this stack publishes at all.
      #   7777/tcp  reliable messaging alongside the UDP stream
      #   8888/tcp  the server API - the in-game Server Manager talks to this
      #             to claim, configure and join. Self-signed TLS, so clients
      #             get a certificate prompt on first connect.
      #
      # Published on all interfaces deliberately, NOT bound to 10.0.0.4, so
      # forwarded WAN traffic reaches them. That is what makes this the
      # documented exception rather than a stray - bootstrap.sh check 6 knows
      # about it by name.
      - '7777:7777/udp'
      - '7777:7777/tcp'
      - '8888:8888/tcp'

    # 16G ceiling, 8G held back for it. Upstream suggests 8-16G and the ceiling
    # is what stops a late-game save taking the box down: forge has 32GB total
    # and Immich, Frigate, Home Assistant and Beszel all live on it. An
    # unbounded game server would win an OOM fight against the cameras.
    #
    # Compose V2 honours these outside Swarm. If the server starts getting
    # OOM-killed mid-session (exit code 137 in `docker inspect`), that is the
    # signal to raise the limit - but check what else is resident first, and
    # read docs/satisfactory.md#when-16g-is-not-enough before going past 20G.
    deploy:
      resources:
        limits:
          memory: 16G
        reservations:
          memory: 8G

    # No healthcheck. Upstream ships none, and the obvious substitutes are
    # wrong: the API on 8888 answers long before the save has finished loading,
    # so a check against it would report healthy on a server nobody can join.
    # Nothing in this repo restarts on unhealthy anyway - Beszel alerting on
    # the container being gone is the real signal.

    # No `networks:` key on THIS service, deliberately. A top-level networks
    # block now exists for the sidecar below, and a service that names no
    # network still lands on compose's own `default` bridge - which is exactly
    # what this one wants: outbound internet for SteamCMD and no route to any
    # other stack. It is NOT on `proxy` - see note 3 at the top of this file.

  # --- the save, served for the Interactive Map -------------------------------
  #
  # satisfactory-calculator.com's Interactive Map loads a save from any URL
  # handed to it as ?url=... The fetch happens IN THE BROWSER, not on their
  # servers - which is why the requirement upstream documents is a CORS header
  # rather than a public address.
  #
  # That one fact is what lets this stay LAN-only, behind the @notlocal guard,
  # with no DNS record and no port forward: the only machine that has to reach
  # this container is the one you are sitting at.
  #
  # The CORS headers are NOT here. They live on the spaghetti.<domain> block in
  # the Caddyfile, because that is where the browser's request terminates and
  # because hostname behaviour belongs in the routing table rather than
  # scattered across stacks.
  saves:
    container_name: satisfactory-saves
    hostname: satisfactory-saves

    # Stock Caddy, used as a one-line static file server. No Caddyfile, no
    # config volume, nothing to keep in sync with stacks/caddy - routing, TLS
    # and CORS all happen one hop up.
    image: docker.io/library/caddy:${CADDY_SAVES_VERSION:-2.11-alpine}
    restart: unless-stopped

    # `--root` is the only thing standing between this and serving the whole
    # mount. Do not point it at /saves.
    command: caddy file-server --root /saves/latest --listen :80

    environment:
      TZ: ${TZ:-America/Chicago}

    volumes:
      # Both read-only, and mounted as SIBLINGS under /saves because the link
      # that updater/latest-save.sh writes is relative:
      #
      #   latest/latest.sav -> ../saved/SaveGames/<session>/<file>.sav
      #
      # An absolute /srv/... target would dangle inside the container, which is
      # the failure this layout exists to avoid.
      #
      # gamefiles/ (20GB) and backups/ are deliberately not mounted. A web
      # server has no reason to be able to read either of them.
      - ${SATISFACTORY_DATA:-/srv/satisfactory}/latest:/saves/latest:ro
      - ${SATISFACTORY_DATA:-/srv/satisfactory}/saved:/saves/saved:ro

    # No ports. Reached by container name from Caddy on `proxy`, like every
    # other app in the house. bootstrap.sh check 6 allow-lists `satisfactory`
    # and not `satisfactory-saves`, which is correct - if this ever starts
    # publishing something, that check should complain.
    networks:
      - proxy

    # A file server streams rather than buffering the save, so this is generous
    # rather than tight. Its real job is to guarantee that serving a save can
    # never join an OOM fight with the game container above or with Frigate.
    deploy:
      resources:
        limits:
          memory: 128M

    # --spider is a HEAD, so this proves three things - the mount is there, the
    # relative symlink resolves, and Caddy is listening - without dragging a
    # several-hundred-megabyte save through the loopback every minute. (wget
    # here is busybox's, from the alpine image.)
    #
    # EXPECT UNHEALTHY until the server has written its first autosave. That is
    # the check working, not failing, and nothing in this repo restarts on
    # unhealthy - same as the note on the game container above.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/latest.sav"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s

  # --- the updater ------------------------------------------------------------
  #
  # Repoints latest/latest.sav at the newest save, once a minute, forever.
  #
  # THE ONLY SERVICE IN THIS FILE THAT CAN WRITE ANYTHING. It writes exactly one
  # symlink, into a directory that contains nothing else. saved/ is mounted
  # read-only here as well, so the saves themselves are unreachable for writing
  # from every container in this stack except the game itself.
  #
  # This was a systemd timer on the host first. That worked, and it was the
  # wrong shape: it needed `sudo install` and `daemon-reload` on every edit, it
  # sat outside git's deploy path and Komodo's, and it needed root plus
  # ProtectSystem to do less than this container does unprivileged. Everything
  # it touches is mounted here already. See
  # docs/decisions.md#amendment-the-updater-belongs-in-the-stack.
  saves-updater:
    container_name: satisfactory-saves-updater
    hostname: satisfactory-saves-updater

    # Debian rather than the alpine image `saves` uses, and not to be clever:
    # the script needs `find -printf`, `ln -r` and `mv -T`, and busybox has
    # none of the three. Rewriting around them would trade a 30MB image for a
    # script that quietly does the wrong thing on a filename with a space in
    # it - and this server's saves are called "Flat Earth_autosave_3.sav".
    image: docker.io/library/debian:${SATISFACTORY_UPDATER_VERSION:-trixie-slim}
    restart: unless-stopped

    # PID 1 is a shell loop. init: true puts a real init in front of it so
    # signals and zombies are somebody's job.
    init: true

    # `bash <path>` rather than executing the script directly. This repo is
    # authored on Windows, where git runs with core.filemode=false, so a new
    # script is committed 100644 however it looks locally - the execute bit is
    # not a thing this workflow can reliably set. The host systemd unit hid
    # that behind `install -m 755`; there is nothing to hide it here.
    command: ["bash", "/opt/updater/latest-save.sh", "--loop"]

    environment:
      TZ: ${TZ:-America/Chicago}
      INTERVAL: "60"

    # No root. The symlink lands in a directory bootstrap.sh already owns as
    # 1000:1000, and reading a save needs nothing more than the mode bits the
    # game writes.
    user: "${PUID:-1000}:${PGID:-1000}"

    # It has no business talking to anything. Not on `proxy`, not on the
    # stack's default bridge, not on the internet.
    network_mode: none

    volumes:
      # The script, mounted as a DIRECTORY rather than as a single file. Docker
      # binds a single-file mount by inode and git replaces files by rename, so
      # a file mount here would leave the container running the pre-pull script
      # while `git log` says otherwise - the exact trap the Caddyfile carries.
      # A directory mount follows the directory and has no such problem. See
      # docs/decisions.md#single-file-bind-mounts-need-a-recreate-not-a-reload.
      - ./updater:/opt/updater:ro

      # Read-only, like the web server's copy. This container reads saves and
      # writes nothing into them.
      - ${SATISFACTORY_DATA:-/srv/satisfactory}/saved:/saves/saved:ro

      # The one writable mount in the stack outside the game's own /config.
      # Mounted at the same relative position as saved/ so that the symlink can
      # be relative and therefore valid on the host as well - see the comment
      # in updater/latest-save.sh.
      - ${SATISFACTORY_DATA:-/srv/satisfactory}/latest:/saves/latest

    # Nothing else needs to be writable, and the heartbeat is the only file the
    # script creates outside the mount above.
    read_only: true
    tmpfs:
      - /tmp

    # Healthy = a pass completed in the last three intervals. This is the check
    # that justifies the container existing separately: a watcher backgrounded
    # inside `saves` could die without the web server noticing, and the only
    # symptom would be a map that silently stopped updating.
    healthcheck:
      test: ["CMD", "bash", "/opt/updater/healthcheck.sh"]
      interval: 60s
      timeout: 5s
      retries: 2
      start_period: 90s

    deploy:
      resources:
        limits:
          memory: 64M

networks:
  # Shared with Caddy and everything else it routes to. Only `saves` joins it;
  # the game container above stays on this stack's private default bridge.
  proxy:
    external: true
