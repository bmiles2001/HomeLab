name: caddy

# The only stack that publishes ports to the LAN. Everything else is reached
# through it over the shared `proxy` network, by container name.
#
# Deploy:  ./scripts/deploy.sh caddy
#
# Ports 80/443 are privileged, and rootful Docker binds them without ceremony.
#
# Because Docker writes its iptables rules ahead of UFW's, these ports are
# reachable from the LAN whether or not `ufw allow` says so. That is intended
# here - it is a mistake anywhere else. See docs/forge-session-runbook.md.

services:
  caddy:
    container_name: caddy
    # Stock Caddy has no DNS providers compiled in. This is the standard
    # prebuilt image with the Cloudflare DNS module included.
    # Must be a build dated after 2026-03-23. Cloudflare switched to prefixed
    # "scannable" API tokens (cfut_ user, cfat_ account) with no announcement,
    # and caddy-dns/cloudflare rejected the new shape in a local regex before
    # ever calling the API - caddy-dns/cloudflare#123. The 2.10 images predate
    # the fix and fail at startup with "API token appears invalid".
    image: ghcr.io/caddybuilds/caddy-cloudflare:${CADDY_VERSION:-2.11}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    environment:
      # Injected by `infisical run` at deploy time; never written to disk.
      # The token needs Zone > DNS > Edit on your zone and nothing more.
      CF_API_TOKEN: ${CF_API_TOKEN:?not injected - deploy via scripts/deploy.sh}
      ACME_EMAIL: ${ACME_EMAIL:?not injected - deploy via scripts/deploy.sh}
      DOMAIN: ${DOMAIN:?not injected - deploy via scripts/deploy.sh}
    extra_hosts:
      # Cockpit runs on the host, not in a container, so it cannot be reached
      # by container name like every other upstream. Docker maps this to the
      # proxy network's gateway (172.18.0.1, pinned in bootstrap.sh).
      #
      # `host-gateway` rather than a literal address so it survives a network
      # rebuild that hands `proxy` a different subnet - the one failure pinning
      # is meant to prevent but cannot guarantee.
      - "host.docker.internal:host-gateway"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro,z
      - caddy_data:/data          # certificates and ACME account - do not lose
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  caddy_data:
  caddy_config:
  caddy_logs:

networks:
  proxy:
    external: true
