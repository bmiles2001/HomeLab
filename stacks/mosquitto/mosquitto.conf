# Mosquitto broker config. Source of truth; mounted read-only.
#
# Deliberately minimal. This broker exists to carry Frigate's events to Home
# Assistant and nothing else - it is not a general-purpose IoT bus, and every
# feature not turned on here is one that cannot be misconfigured later.

# Drop from root after binding. The container's entrypoint starts as root so it
# can write the password file, so without this the broker would keep running as
# root for no reason.
user mosquitto

listener 1883 0.0.0.0

# No anonymous access. Mosquitto 2.x defaults to denying it, but stating it
# explicitly means a future edit to this file cannot re-enable it by omission.
allow_anonymous false
password_file /mosquitto/config/passwd

# Retained messages and QoS>0 queues survive a restart. Frigate publishes its
# camera states retained, so without this Home Assistant shows every camera as
# unavailable until the next event fires.
persistence true
persistence_location /mosquitto/data/

# stdout, so `docker logs mosquitto` works like every other stack here.
log_dest stdout
log_type error
log_type warning
log_type notice

# No TLS. The only traffic on this broker never leaves the `iot` bridge
# network, and terminating TLS here would mean a second certificate lifecycle
# for a hop that does not cross a wire. If this broker ever gains a client
# outside the box, that calculation changes and this line becomes wrong.
